# Slower checks: differential fuzzing and sweeps against the regex crate,
# and the Callgrind performance gate.  `rethoc fuzz --batch` and
# `rethoc sweep` cap each child process themselves; scripts/capped caps
# the parent.
name: Differential

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p rethoc-cli
      - name: Fuzz seeds 0..9000
        run: >-
          scripts/capped --time 1800
          target/release/rethoc fuzz --batch 250
          --allow-slow ci/known-slow-seeds.txt 0 9000
      # The same seeds on the other side of the engine's thresholds: DFA
      # caches at their minimum size, so that they are emptied every few
      # bytes, and byte equivalence classes for every pattern.  Results
      # must not change.  Runs even when the step above failed: a failure
      # there must not hide a regression that only shows here.
      - name: Fuzz seeds 0..9000, extreme regime
        if: ${{ !cancelled() }}
        env:
          RETHOC_DFA_STATES: 8
          RETHOC_BYTE_CLASS_MIN_STATES: 0
        run: >-
          scripts/capped --time 1800
          target/release/rethoc fuzz --batch 250
          --allow-slow ci/known-slow-seeds.txt 0 9000
      # The experimental sparse counting variant of the grouped NFA is
      # checked only on request: the runs above do not compile it.
      - name: Fuzz seeds 0..9000, sparse counting
        if: ${{ !cancelled() }}
        run: >-
          scripts/capped --time 1800
          target/release/rethoc fuzz --batch 250 --sparse-counting 0 9000
      # Disabled until #5 is fixed: one MatcherMemory reused across regexes
      # panics (from seed 6).  Enable it in the PR that fixes #5.
      # - name: Fuzz seeds 0..9000, one MatcherMemory per run
      #   run: >-
      #     scripts/capped --time 1800
      #     target/release/rethoc fuzz --shared-memory --batch 250
      #     --allow-slow ci/known-slow-seeds.txt 0 9000

  sweep:
    name: sweep (${{ matrix.family }}${{ matrix.tiers && format(', {0}', matrix.tiers) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Tier 3 is known to be unsound and is to be redesigned, not patched
    # (docs/bugs/069, "What is left").  Where a family reaches its known
    # defects, the other tiers are checked in a blocking job and Tier 3
    # in one whose result is reported but does not block: 480 runs of
    # assert-in-body, 100 of tier3-assert.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: nullable-counter
            allow-failure: false
          - family: assert-edges
            allow-failure: false
          - family: tier1-assert
            tiers: --tier 1
            allow-failure: false
          - family: assert-in-body
            tiers: --skip-tier 3
            allow-failure: false
          - family: assert-in-body
            tiers: --tier 3
            allow-failure: true
          - family: tier3-assert
            allow-failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p rethoc-cli
      - run: scripts/capped --time 1800 target/release/rethoc sweep ${{ matrix.tiers }} ${{ matrix.family }}
      # Again on the other side of the engine's thresholds (minimum DFA
      # cache, byte classes for every pattern); runs even when the step
      # above reported mismatches.
      - name: Extreme regime
        if: ${{ !cancelled() }}
        env:
          RETHOC_DFA_STATES: 8
          RETHOC_BYTE_CLASS_MIN_STATES: 0
        run: scripts/capped --time 1800 target/release/rethoc sweep ${{ matrix.tiers }} ${{ matrix.family }}
      # And once with a debug build, on shorter inputs, so that the
      # engine's own debug assertions take part.  Bug 69 was a debug
      # assertion that fired at compile time for patterns no test
      # compiled.
      - name: Debug build
        if: ${{ !cancelled() }}
        run: |
          cargo build -p rethoc-cli
          scripts/capped --time 1800 target/debug/rethoc sweep --max-len 4 ${{ matrix.tiers }} ${{ matrix.family }}

  callgrind:
    # Compares instruction and branch-miss counts of this PR against its
    # base branch, measured in the same job (same machine and toolchain).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GUNGRAUN_RUNNER_VERSION: 0.20.0 # must match the gungraun dev-dependency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Cache gungraun-runner
        id: runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/gungraun-runner
          key: gungraun-runner-${{ env.GUNGRAUN_RUNNER_VERSION }}-${{ runner.os }}
      - if: steps.runner-cache.outputs.cache-hit != 'true'
        run: cargo install gungraun-runner --version "$GUNGRAUN_RUNNER_VERSION" --locked
      - name: Baseline from the base branch
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$GITHUB_BASE_REF"
          cp rethoc-engine/benches/reengage_profile.rs "$RUNNER_TEMP/base/rethoc-engine/benches/"
          cp rethoc-engine/benches/common/reengage_cases.rs "$RUNNER_TEMP/base/rethoc-engine/benches/common/"
          cd "$RUNNER_TEMP/base"
          if ! CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
            cargo --config "build.build-dir=\"$RUNNER_TEMP/base-build\"" \
              bench --bench reengage_profile --no-run; then
            echo "::warning::Candidate fixtures could not build on the base branch. Using base fixtures."
            git restore -- rethoc-engine/benches/reengage_profile.rs \
              rethoc-engine/benches/common/reengage_cases.rs
          fi
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
            cargo --config "build.build-dir=\"$RUNNER_TEMP/base-build\"" \
              bench --bench reengage_profile -- --save-baseline=main
      - name: Tier 1 and Tier 2 baselines with identical fixtures
        id: assertion_baseline
        run: |
          cp rethoc-engine/benches/{tier1_assertions_profile,tier2_profile}.rs "$RUNNER_TEMP/base/rethoc-engine/benches/"
          cp rethoc-engine/benches/common/{assertion_cases,scan}.rs "$RUNNER_TEMP/base/rethoc-engine/benches/common/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path(os.environ['RUNNER_TEMP']) / 'base/rethoc-engine/Cargo.toml'
          text = manifest.read_text()
          for name in ("tier1_assertions_profile", "tier2_profile"):
              if f'name = "{name}"' not in text:
                  text += f'\n[[bench]]\nname = "{name}"\nharness = false\n'
          manifest.write_text(text)
          PY
          cd "$RUNNER_TEMP/base"
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" \
            cargo --config "build.build-dir=\"$RUNNER_TEMP/base-build\"" \
              bench --bench tier1_assertions_profile --bench tier2_profile -- --save-baseline=main
      # Share measurements only, never compiled artifacts across revisions.
      - name: Copy measurement baselines
        id: copy_baselines
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/gungraun"
          cp -a "$RUNNER_TEMP/base-target/gungraun/." "$GITHUB_WORKSPACE/target/gungraun/"
      - name: Compare this PR against the baseline
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo --config "build.build-dir=\"$RUNNER_TEMP/candidate-build\"" \
              bench --bench reengage_profile -- --baseline=main
      - name: Compare Tier 1 and Tier 2 profiles
        if: >-
          ${{ !cancelled()
              && steps.assertion_baseline.outcome == 'success'
              && steps.copy_baselines.outcome == 'success' }}
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo --config "build.build-dir=\"$RUNNER_TEMP/candidate-build\"" \
              bench --bench tier1_assertions_profile --bench tier2_profile -- --baseline=main
