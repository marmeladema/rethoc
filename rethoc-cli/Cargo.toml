[package]
name = "rethoc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rethoc"
path = "src/main.rs"

[dependencies]
bpaf = { version = "0.9.29", features = ["derive"] }
regex = "1.13.1"
rethoc-engine = { path = "../rethoc-engine" }
serde_json = "1"
